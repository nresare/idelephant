# Strategic merge patch for an existing Deployment with a container named idfrog.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idfrog
  namespace: idfrog
spec:
  template:
    spec:
      containers:
        - name: idfrog
          volumeMounts:
            - name: entra-client-credential
              mountPath: /var/run/idfrog/entra
              readOnly: true
      volumes:
        - name: entra-client-credential
          secret:
            secretName: idfrog-entra-client
