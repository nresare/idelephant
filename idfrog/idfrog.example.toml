origin = "https://idfrog.noa.re"
listen = "0.0.0.0:8080"
signing-key-file = "signing-key.pem"
# Optional direct HTTPS. Otherwise terminate HTTPS at the ingress.
# tls-cert-path = "/tls/tls.crt"
# tls-key-path = "/tls/tls.key"

[[resource]]
uri = "https://tools.example.com/mcp"
application-id = "0816f759-d89d-4319-a8d7-d88b5d751dc9"

# Optional OTLP/gRPC export, with service-name defaulting to "idfrog".
# [traces]
# endpoint = "http://tempo.tempo.svc:4317"
# excluded-paths = ["/healthz"]

[upstream]
issuer = "https://login.microsoftonline.com/YOUR-TENANT-ID/v2.0"
client-id = "73058fe2-56c3-42be-8fe1-e8f3e65ade9f"

[upstream.authentication]
method = "private-key-jwt"
certificate-file = "/var/run/idfrog/entra/tls.crt"
private-key-file = "/var/run/idfrog/entra/tls.key"
# For an OIDC provider using a shared secret, replace this table with:
# method = "client-secret-post"
# client-secret-file = "client-secret"

# Public clients with HTTPS metadata URLs need no local registration.
# For a client without a metadata document, register it in configuration:
# [[clients]]
# client-id = "local-mcp-client"
# name = "Local MCP client"
# redirect-uris = ["http://127.0.0.1:3000/callback"]
# native = true
