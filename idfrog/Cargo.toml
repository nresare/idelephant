[package]
name = "idfrog"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An OAuth broker for MCP servers backed by upstream OpenID Connect SSO"

[dependencies]
idp-oauth = { version = "0.1.0", path = "../crates/oauth" }
idp-server = { version = "0.1.0", path = "../crates/server", features = ["telemetry"] }
anyhow = { version = "1.0" }
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = { version = "0.23" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
x509-cert = { version = "0.3", features = ["pem"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
p256 = { version = "0.14", features = ["getrandom", "pkcs8", "pem"] }
rand = { version = "0.10" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = { version = "0.11" }
subtle = "2.6"
thiserror = { version = "2.0" }
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
rsa = "0.9"
rand_legacy = { package = "rand", version = "0.8" }
reqwest = { version = "0.13", features = ["json", "rustls"] }
tower = { version = "0.5", features = ["util"] }
idp-oauth = { version = "0.1.0", path = "../crates/oauth", features = ["test-support"] }
