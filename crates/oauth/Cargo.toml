[package]
name = "idp-oauth"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "OAuth 2.0 and OpenID Connect building blocks for identity providers and MCP brokers"
repository = "https://github.com/nresare/idelephant"
readme = "README.md"
rust-version = "1.99"
keywords = ["oauth", "openid-connect", "mcp", "pkce"]
categories = ["authentication", "web-programming"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
base64 = { version = "0.23" }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
p256 = { version = "0.14", features = ["getrandom", "pkcs8", "pem"] }
rand = { version = "0.10" }
reqwest = { version = "0.13", features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = { version = "2.0" }
tokio = { version = "1.51", features = ["net", "sync", "time"] }
tracing = "0.1"
url = "2.5"
sha2 = "0.11"
subtle = "2.6"

[dev-dependencies]
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
